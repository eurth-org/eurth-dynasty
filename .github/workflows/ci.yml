name: CI

on:
  push:
    branches: [main]
  pull_request:

# Until the site exists this only checks the engine. Nothing is deployed: Dynasty's door opens on
# 15 December 2026, and the launch workflow (to come) is the only thing that may put it online.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
